name: Actualizar Portafolio IBKR

on:
  schedule:
    # Se ejecuta de lunes a viernes a las 13:00, 17:00 y 21:00 UTC
    - cron: '0 13,17,21 * * 1-5'
  workflow_dispatch: # Botón para ejecutar manualmente cuando se desee

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
        run: python actualizar_ibkr.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add IBKR_Portofolio_Dashboard.csv
          git commit -m "Actualizacion automatica de datos IBKR [skip ci]" || exit 0
          git push
