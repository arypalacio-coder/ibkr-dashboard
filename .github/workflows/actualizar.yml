name: Actualizar Portafolio IBKR

on:
  schedule:
    # Se ejecuta de Martes a Sabado a las 08:15 UTC (04:15 AM hora local)
    # Extrae la jornada cerrada y consolidada del dia anterior (Lunes a Viernes)
    - cron: '15 8 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests pandas yfinance

      - name: Ejecutar script
        env:
          IBKR_TOKEN: ${{ secrets.IBKR_TOKEN }}
          IBKR_QUERY_ID: ${{ secrets.IBKR_QUERY_ID }}
        run: python actualizar_ibkr.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualizacion automatica de datos IBKR y Benchmark SPY [skip ci]" || exit 0
          git pull --rebase origin main
          git push